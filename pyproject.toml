[project]
name = "swarm-cavity"
version = "0.1.0"
description = "Dynamical mean-field / cavity theory of LLM agent swarms"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=15",
    "networkx>=3.2",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=4.46", "nnsight>=0.3", "accelerate>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theory", "envs", "engine", "cavity", "analysis", "interp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
